# TEMPORARY diagnostic for QUEUE item CI1 — DELETED BEFORE THE PR IS OPENED.
# It measures, on the actual windows-latest runner, which of three candidate
# mechanisms makes test 266.25 fail there and nowhere else. It changes no
# production code and gates nothing.
name: CI1 probe (temporary)

on:
  push:
    branches: [fix/win-ci-266-25-path-canonicalisation]

permissions:
  contents: read

jobs:
  probe:
    name: CI1 probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Probe 266.25
        shell: bash
        run: |
          cat > ci1-probe.cjs <<'PROBE'
          const fs=require('fs'),os=require('os'),path=require('path'),cp=require('child_process');
          const ROOT=process.cwd();
          const preP=path.join(ROOT,'scripts','worktree-preflight.js');
          const env={};for(const k of Object.keys(process.env))if(!/^GIT_/i.test(k))env[k]=process.env[k];
          const g=(cwd,args)=>cp.spawnSync('git',args,{cwd,env,encoding:'utf8',windowsHide:true});
          const run=(s,cwd,extra)=>cp.spawnSync('node',[s],{cwd,env:Object.assign({},env,extra||{}),encoding:'utf8',windowsHide:true});
          const tmp=fs.mkdtempSync(path.join(os.tmpdir(),'ci1probe-'));
          const main=path.join(tmp,'main'),wt=path.join(tmp,'wt');
          fs.mkdirSync(main);g(main,['init','-q']);
          fs.writeFileSync(path.join(main,'a.txt'),'a\n');g(main,['add','.']);
          g(main,['-c','user.email=t@x','-c','user.name=t','commit','-q','--no-verify','-m','f']);
          const wa=g(main,['worktree','add','-q',wt,'-b','feat']);
          console.log('=== CI1 PROBE ===');
          console.log('platform        :',process.platform);
          console.log('node            :',process.version);
          console.log('os.tmpdir()     :',JSON.stringify(os.tmpdir()));
          console.log('env TEMP        :',JSON.stringify(process.env.TEMP||null));
          console.log('env TMP         :',JSON.stringify(process.env.TMP||null));
          console.log('env RUNNER_TEMP :',JSON.stringify(process.env.RUNNER_TEMP||null));
          console.log('os.homedir()    :',JSON.stringify(os.homedir()));
          console.log('worktree add    :',wa.status,wa.stderr.trim());
          console.log('fixture wt (JS) :',JSON.stringify(wt));
          try{console.log('realpath.native :',JSON.stringify(fs.realpathSync.native(wt)));}catch(e){console.log('realpath.native : THREW',e.message);}
          console.log('git toplevel    :',JSON.stringify(g(wt,['--no-optional-locks','rev-parse','--show-toplevel']).stdout.trim()));
          for(const l of g(wt,['--no-optional-locks','worktree','list','--porcelain']).stdout.split('\n'))
            if(l.startsWith('worktree '))console.log('git wt root     :',JSON.stringify(l.slice(9)));
          const up=os.uptime(),now=Date.now(),boot=now-up*1000;
          console.log('os.uptime() s   :',up);
          console.log('Date.now()      :',now);
          console.log('bootTimeMs      :',boot,new Date(boot).toISOString());
          const sess=fs.mkdtempSync(path.join(os.tmpdir(),'ci1probe-sessions-'));
          fs.writeFileSync(path.join(sess,'4242.json'),JSON.stringify({pid:4242,cwd:wt,startedAt:boot-3600e3}));
          fs.writeFileSync(path.join(sess,process.pid+'.json'),JSON.stringify({pid:process.pid,cwd:wt,startedAt:boot+60e3}));
          console.log('parent pid      :',process.pid);
          const r=run(preP,wt,{ROBCO_CLAUDE_SESSIONS_DIR:sess});
          console.log('--- preflight exit',r.status,'---');
          console.log(r.stdout);
          if(r.stderr&&r.stderr.trim())console.log('--- stderr ---'+r.stderr);
          const o=r.stdout||'';
          console.log('--- RAW writer/summary lines ---');
          for(const l of o.split('\n'))if(/writers|claude pid|is in this repository/.test(l))console.log(JSON.stringify(l));
          const checks=[
            ['A stale-line  ',/claude pid 4242\s+STALE \(record predates this boot/.test(o)],
            ['B present-line',new RegExp('claude pid '+process.pid+'\\s+PRESENT').test(o)],
            ['C not-counted ',!/a Claude session \(pid 4242\)/.test(o)],
            ['D counted     ',new RegExp('a Claude session \\(pid '+process.pid+'\\) is in this repository').test(o)],
          ];
          console.log('--- 266.25 sub-assertions ---');
          for(const [n,v] of checks)console.log(n,v?'PASS':'FAIL');
          console.log('OVERALL',checks.every(c=>c[1])&&r.status===0?'PASS':'FAIL');
          const up2=os.uptime(),now2=Date.now();
          console.log('boot delta ms   :',(now2-up2*1000)-boot);
          PROBE
          node ci1-probe.cjs
          rm -f ci1-probe.cjs
